services:
  api:
    build:
      context: .
      dockerfile: apps/modeling-agent-api/Dockerfile
    environment:
      APP_MODE: ${APP_MODE:-fake}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KNOWLEDGE_ROOT: /workspace/knowledge/math-modeling-skills/skills
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://modeling:modeling@mysql:3306/modeling}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-math_modeling_knowledge_v1}
      CHAT_API_BASE: ${CHAT_API_BASE:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: modeling
      MYSQL_USER: modeling
      MYSQL_PASSWORD: modeling
      MYSQL_ROOT_PASSWORD: local-root-only
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-umodeling", "-pmodeling"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  mysql-data:
  qdrant-data:
